# Push a tag like v0.3.0 → signed (Developer ID), notarized, stapled NotchPeek-<version>.zip on a GitHub Release.
# The same run signs the auto-update feed (appcast.xml) with SPARKLE_PRIVATE_KEY and attaches it.
# Secrets (same as spiel / margins-v2): APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_API_KEY (base64 .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER,
# SPARKLE_PRIVATE_KEY (Sparkle EdDSA private key, base64; its public half is SUPublicEDKey in Info.plist).
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/notchpeek-signing.keychain-db"
          KCPW=$(openssl rand -hex 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC" \
            || { echo "::error::APPLE_CERTIFICATE did not import with APPLE_CERTIFICATE_PASSWORD."; exit 1; }
          rm "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC" || echo "intermediate already present"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          old=(); while IFS= read -r k; do old+=("$k"); done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"$//')
          security list-keychains -d user -s "$KC" "${old[@]}"
          security find-identity -v -p codesigning "$KC"

      - name: Build, sign, notarize, staple
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          echo "$APPLE_API_KEY" | base64 --decode > "$KEY"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)
          ./build.sh "Developer ID Application"
          ditto -c -k --keepParent build/NotchPeek.app build/upload.zip
          xcrun notarytool submit build/upload.zip --key "$KEY" --key-id "$KEY_ID" --issuer "$ISSUER" --wait --timeout 30m
          xcrun stapler staple build/NotchPeek.app
          spctl -a -vvv -t exec build/NotchPeek.app
          ditto -c -k --keepParent build/NotchPeek.app "build/NotchPeek-$VERSION.zip"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Sign the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::SPARKLE_PRIVATE_KEY is empty"; exit 1; }
          TAG="${GITHUB_REF_NAME}"; [[ "$TAG" == v* ]] || TAG="v$VERSION"
          KEY="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY"
          # Installed copies only accept updates signed by the key whose public half they ship with.
          WANT=$(plutil -extract SUPublicEDKey raw Info.plist)
          GOT=$({ printf '302e020100300506032b657004220420' | xxd -r -p; base64 -d < "$KEY"; } | openssl pkey -inform DER -pubout -outform DER | tail -c 32 | base64)
          [ "$WANT" = "$GOT" ] || { echo "::error::SPARKLE_PRIVATE_KEY's public half ($GOT) is not SUPublicEDKey ($WANT)"; exit 1; }
          mkdir -p build/feed && cp "build/NotchPeek-$VERSION.zip" build/feed/
          T=vendor/sparkle-tools/bin
          $T/generate_appcast --ed-key-file "$KEY" --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/" -o build/appcast.xml build/feed
          grep -q "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>" build/appcast.xml || { echo "::error::appcast lacks $VERSION"; exit 1; }
          sig=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' build/appcast.xml | head -1)
          $T/sign_update --verify --ed-key-file "$KEY" "build/NotchPeek-$VERSION.zip" "$sig"
          cat build/appcast.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="v$VERSION"
          gh release create "$TAG" "build/NotchPeek-$VERSION.zip" build/appcast.xml --title "NotchPeek $VERSION" --notes "Signed and notarized." --latest \
            || gh release upload "$TAG" "build/NotchPeek-$VERSION.zip" build/appcast.xml --clobber

      - name: Clean up keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/sparkle.key"
          security delete-keychain "$RUNNER_TEMP/notchpeek-signing.keychain-db" 2>/dev/null || true
